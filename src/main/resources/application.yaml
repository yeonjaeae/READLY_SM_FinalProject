spring:
  application:
    name: READLY

  # 실제 비밀값은 git에 올리지 않는 application-local.yaml 에 둔다 (없으면 무시)
  config:
    import: optional:classpath:application-local.yaml

  datasource:
    # 배포 환경에서는 DB_URL 환경변수로 주입한다 (없으면 로컬 기본값)
    url: ${DB_URL:jdbc:postgresql://localhost:5432/readly}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update

  data:
    redis:
      # Render 환경변수 주입 (로컬에서는 localhost로 동작)
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Render Redis에 비밀번호가 설정되어 있을 경우를 대비
      password: ${REDIS_PASSWORD:}

# 채팅 발행/구독은 Kafka에서 Redis Pub/Sub으로 옮겼다 (known-issues #19).
# 채널 이름은 코드 상수(RedisSubConfig.CHAT_CHANNEL)라 별도 설정이 없다.

chat:
  archive:
    # Redis TTL(7일)이 끝난 채팅은 chat_archive 테이블로 옮겨 두고, 옮긴 지 이 기간이 지나면 지운다
    retention-days: ${CHAT_ARCHIVE_RETENTION_DAYS:30}
    # 삭제 작업 실행 주기 (기본: 매일 04:00)
    purge-cron: ${CHAT_ARCHIVE_PURGE_CRON:0 0 4 * * *}

jwt:
  # 32바이트 이상. 환경변수 JWT_SECRET 또는 application-local.yaml 로 주입
  secret: ${JWT_SECRET}
  access-token-validity-in-seconds: 3600

aladin:
  # 알라딘 상품 조회(ItemLookUp) API 주소
  # http로 호출하면 301(https로 이동) 응답이 오고 RestTemplate이 이를 따라가지 않으므로 반드시 https로 둔다
  base-url: https://www.aladin.co.kr/ttb/api/ItemLookUp.aspx
  # 알라딘 상품 검색(ItemSearch) API 주소. 제목으로 책을 찾아 isbn13을 얻는 데 쓴다
  search-url: https://www.aladin.co.kr/ttb/api/ItemSearch.aspx
  # 알라딘에서 발급받은 TTB Key. 절대 하드코딩하지 않는다.
  # 환경변수 ALADIN_TTB_KEY 또는 application-local.yaml 로 주입
  ttb-key: ${ALADIN_TTB_KEY}

cors:
  # 브라우저에서 이 API를 호출할 수 있는 프론트엔드 출처. 콤마로 여러 개를 넣을 수 있고,
  # "https://*.vercel.app" 같은 와일드카드 패턴도 쓸 수 있다.
  # 배포 환경에서는 CORS_ALLOWED_ORIGINS 환경변수로 실제 도메인을 주입한다.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

ai:
  base-url: ${AI_BASE_URL:http://localhost:8001}
  # AI 서버는 LLM 응답 생성 + 콜드 스타트로 수십 초가 걸린다. 공용 RestTemplate(10초)과 따로 둔다.
  connect-timeout-seconds: ${AI_CONNECT_TIMEOUT_SECONDS:10}
  read-timeout-seconds: ${AI_READ_TIMEOUT_SECONDS:120}
  # AI 서버가 우리 채팅 API를 호출할 때 X-AI-API-KEY 헤더에 넣어야 하는 값
  api-key: ${AI_API_KEY:default-readly-key}
